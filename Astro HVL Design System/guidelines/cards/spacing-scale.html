<!-- @dsCard group="Spacing" viewport="700x160" name="Spacing scale" subtitle="4px base — calm, consistent rhythm" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--bg-page); padding: 22px 28px; }
  .row { display:flex; align-items:flex-end; gap:14px; }
  .item { display:flex; flex-direction:column; gap:6px; align-items:center; }
  .bar { background: var(--brand); border-radius: var(--radius-xs); width: 28px; }
  .n { font-family: var(--font-mono); font-size:10px; color:var(--text-muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="bar" style="height:4px"></div><span class="n">1·4</span></div>
    <div class="item"><div class="bar" style="height:8px"></div><span class="n">2·8</span></div>
    <div class="item"><div class="bar" style="height:12px"></div><span class="n">3·12</span></div>
    <div class="item"><div class="bar" style="height:16px"></div><span class="n">4·16</span></div>
    <div class="item"><div class="bar" style="height:24px"></div><span class="n">5·24</span></div>
    <div class="item"><div class="bar" style="height:32px"></div><span class="n">6·32</span></div>
    <div class="item"><div class="bar" style="height:40px"></div><span class="n">7·40</span></div>
    <div class="item"><div class="bar" style="height:48px"></div><span class="n">8·48</span></div>
    <div class="item"><div class="bar" style="height:64px"></div><span class="n">9·64</span></div>
    <div class="item"><div class="bar" style="height:80px"></div><span class="n">10·80</span></div>
  </div>
</body>
</html>
