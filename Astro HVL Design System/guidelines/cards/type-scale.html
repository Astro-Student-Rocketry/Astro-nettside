<!-- @dsCard group="Type" viewport="700x180" name="Type scale" subtitle="Modular ramp — 11px mono micro to 84px hero" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--bg-page); padding: 20px 28px; font-family: var(--font-display); }
  .row { display:flex; align-items:baseline; gap:14px; border-bottom:1px solid var(--border-subtle); padding:6px 0; }
  .row:last-child { border-bottom:0; }
  .name { font-family: var(--font-mono); font-size:10px; color: var(--text-muted); width:64px; }
  .px { font-family: var(--font-mono); font-size:10px; color: var(--text-muted); margin-left:auto; }
  .s { color: var(--text-strong); letter-spacing: var(--ls-tight); line-height:1; }
</style>
</head>
<body>
  <div class="row"><span class="name">5xl</span><span class="s" style="font-size:40px">Astro</span><span class="px">84px display</span></div>
  <div class="row"><span class="name">3xl</span><span class="s" style="font-size:30px">Apogee 3.2 km</span><span class="px">48px h1</span></div>
  <div class="row"><span class="name">2xl</span><span class="s" style="font-size:24px">Static fire</span><span class="px">36px h2</span></div>
  <div class="row"><span class="name">xl</span><span class="s" style="font-size:20px">Subsystems</span><span class="px">28px h3</span></div>
  <div class="row"><span class="name">base</span><span class="s" style="font-size:16px; font-family:var(--font-sans)">Body copy 16px</span><span class="px">16px body</span></div>
</body>
</html>
