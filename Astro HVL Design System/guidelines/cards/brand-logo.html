<!-- @dsCard group="Brand" viewport="700x240" name="Logo lockup" subtitle="Primary lockup — white on navy, navy on light. Keep clear space ≥ the 'a' height" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--bg-page); padding: 20px; }
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .panel { border-radius: var(--radius-lg); border:1px solid var(--border-subtle); display:flex; align-items:center; justify-content:center; height: 190px; position:relative; overflow:hidden; }
  .dark { background: var(--navy-900); }
  .light { background: var(--white); }
  .panel img { width: 62%; position:relative; z-index:1; }
  .tag { position:absolute; left:12px; bottom:10px; font-family:var(--font-mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; z-index:2; }
  .tag.on-dark { color: rgba(255,255,255,.55); }
  .tag.on-light { color: var(--text-muted); }
</style>
</head>
<body>
  <div class="grid">
    <div class="panel dark bp-grid" data-theme="dark">
      <img src="../../assets/logo-astro-white.png" alt="Astro HVL logo">
      <span class="tag on-dark">Primary · on navy</span>
    </div>
    <div class="panel light">
      <img src="../../assets/logo-astro-navy.png" alt="Astro HVL logo">
      <span class="tag on-light">Reverse · on light</span>
    </div>
  </div>
</body>
</html>
