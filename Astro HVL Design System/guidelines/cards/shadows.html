<!-- @dsCard group="Spacing" viewport="700x170" name="Elevation" subtitle="Cool navy-tinted shadows + brand glow" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--bg-page); padding: 26px 28px; }
  .row { display:flex; gap:26px; align-items:center; }
  .item { display:flex; flex-direction:column; gap:10px; align-items:center; }
  .box { width: 96px; height: 64px; background: var(--surface-card); border-radius: var(--radius-md); border:1px solid var(--border-subtle); }
  .n { font-family: var(--font-mono); font-size:10px; color:var(--text-muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="box-shadow:var(--shadow-xs)"></div><span class="n">xs</span></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-sm)"></div><span class="n">sm</span></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-md)"></div><span class="n">md</span></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-lg)"></div><span class="n">lg</span></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-glow); border-color:transparent"></div><span class="n">glow</span></div>
  </div>
</body>
</html>
