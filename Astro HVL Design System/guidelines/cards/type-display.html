<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--bg-page); padding: 24px 28px; }
  .stack { display: flex; flex-direction: column; gap: 6px; }
  .d { font-family: var(--font-display); color: var(--text-strong); letter-spacing: var(--ls-tight); line-height: 1.0; margin:0; }
  .tag { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); }
  .line { display:flex; align-items:baseline; gap:14px; }
</style>
</head>
<body>
  <div class="stack">
    <div class="line"><span class="d" style="font-size:64px; font-weight:600">Apogee</span><span class="tag">64 / 600</span></div>
    <div class="line"><span class="d" style="font-size:40px; font-weight:600">Static fire test</span><span class="tag">40 / 600</span></div>
    <div class="line"><span class="d" style="font-size:28px; font-weight:500">Hybrid propulsion</span><span class="tag">28 / 500</span></div>
    <div class="line"><span class="d" style="font-size:22px; font-weight:500">Bergens høyeste punkt</span><span class="tag">22 / 500</span></div>
  </div>
</body>
</html>
