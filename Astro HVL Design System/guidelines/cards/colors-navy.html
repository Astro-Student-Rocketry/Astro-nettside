<!-- @dsCard group="Colors" viewport="700x150" name="Navy surfaces" subtitle="Dark-forward hero & app surfaces — the blueprint backdrop" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--bg-page); padding: 20px; }
  .row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .sw { border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border-subtle); }
  .chip { height: 72px; }
  .meta { padding: 8px 10px; background: var(--surface-card); }
  .name { font-family: var(--font-mono); font-size: 11px; color: var(--text-strong); font-weight: 600; }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); text-transform: uppercase; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--navy-950)"></div><div class="meta"><div class="name">950</div><div class="hex">060E1A</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--navy-900)"></div><div class="meta"><div class="name">900</div><div class="hex">0A1A2F</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--navy-850)"></div><div class="meta"><div class="name">850</div><div class="hex">0C2138</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--navy-800)"></div><div class="meta"><div class="name">800</div><div class="hex">0F2A47</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--navy-700)"></div><div class="meta"><div class="name">700</div><div class="hex">163A5E</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--navy-600)"></div><div class="meta"><div class="name">600</div><div class="hex">1F4C77</div></div></div>
  </div>
</body>
</html>
