<!-- @template name="Astro HVL marketing page" description="Branded landing scaffold — sticky navy header, blueprint hero with telemetry stats, feature row, join CTA and footer." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Astro HVL — marketing page</title>
<link rel="icon" href="../../assets/favicon.png">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="./ds-base.js"></script>
<style>
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg-page); }

  .t-hd { position: sticky; top: 0; z-index: 50; height: var(--header-h); display: flex; align-items: center;
    background: color-mix(in oklab, var(--navy-900) 88%, transparent); backdrop-filter: blur(14px);
    border-bottom: 1px solid color-mix(in oklab, #fff 9%, transparent); }
  .t-hd__in { width: 100%; max-width: var(--container-wide); margin: auto; padding-inline: var(--gutter);
    display: flex; align-items: center; gap: 20px; }
  .t-hd__logo { height: 28px; }
  .t-hd__nav { display: flex; gap: 4px; margin-left: 12px; }
  .t-hd__nav a { color: #9fb2c8; font-size: 14px; font-weight: 500; padding: 8px 12px; border-radius: var(--radius-sm); text-decoration: none; }
  .t-hd__nav a:hover { color: #fff; background: color-mix(in oklab, #fff 7%, transparent); }
  .t-hd__sp { flex: 1; }
  @media (max-width: 760px) { .t-hd__nav { display: none; } }

  .t-hero { position: relative; overflow: hidden; background: var(--navy-900); }
  .t-hero__glow { position: absolute; top: -200px; right: -140px; width: 640px; height: 640px; border-radius: 50%;
    background: radial-gradient(circle, color-mix(in oklab, var(--blue-500) 34%, transparent), transparent 62%); }
  .t-hero__in { position: relative; max-width: var(--container-wide); margin: auto;
    padding: clamp(56px,8vw,104px) var(--gutter); }
  .t-hero h1 { color: #fff; font-size: clamp(42px,6vw,80px); line-height: .98; letter-spacing: -.025em; margin: 18px 0 0; max-width: 16ch; }
  .t-hero h1 em { font-style: normal; color: var(--blue-400); }
  .t-hero__sub { color: #bcccde; font-size: clamp(16px,1.5vw,19px); line-height: 1.55; max-width: 52ch; margin: 22px 0 30px; }
  .t-hero__cta { display: flex; gap: 12px; flex-wrap: wrap; }
  .t-hero__band { display: flex; gap: clamp(28px,5vw,64px); flex-wrap: wrap; margin-top: clamp(40px,6vw,72px);
    padding-top: 26px; border-top: 1px solid color-mix(in oklab, #fff 10%, transparent); }

  .t-feat { background: var(--bg-page); padding: clamp(56px,8vw,104px) 0; }
  .t-feat__in { max-width: var(--container); margin: auto; padding-inline: var(--gutter); }
  .t-feat__grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 40px; }
  .t-feat__ic { width: 46px; height: 46px; border-radius: var(--radius-md); display: flex; align-items: center;
    justify-content: center; background: var(--surface-inset); color: var(--brand); margin-bottom: 16px; }
  @media (max-width: 760px) { .t-feat__grid { grid-template-columns: 1fr; } }

  .t-ft { background: var(--navy-950); color: #9fb2c8; padding: 44px 0; }
  .t-ft__in { max-width: var(--container-wide); margin: auto; padding-inline: var(--gutter);
    display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; }
  .t-ft__in img { height: 26px; }
  .t-ft__in span { font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; color: #6f859c; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
  const NS = 'AstroHVLDesignSystem_1d7919';

  function Icon({ name, size = 18 }) {
    const L = window.lucide || {};
    const node = (L.icons && L.icons[name]) || [];
    return React.createElement('svg', { width: size, height: size, viewBox: '0 0 24 24', fill: 'none',
      stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round', 'aria-hidden': true },
      node.map((c, i) => React.createElement(c[0], { key: i, ...c[1] })));
  }

  function Page() {
    const { Button, Stat, Card, Badge } = window[NS];
    const FEATURES = [
      ['Flame', 'Propulsion', 'Student-designed hybrid motor running nitrous oxide and a solid fuel grain.'],
      ['CircuitBoard', 'Avionics', 'Custom flight computer logging telemetry, attitude, and apogee detection.'],
      ['Parachute', 'Recovery', 'Dual-deploy recovery — drogue at apogee, main for a soft touchdown.'],
    ];
    return (
      <React.Fragment>
        <header className="t-hd" data-theme="dark">
          <div className="t-hd__in">
            <img className="t-hd__logo" src="../../assets/logo-astro-white.png" alt="Astro HVL" />
            <nav className="t-hd__nav">
              <a href="#">Projects</a><a href="#">Team</a><a href="#">Sponsors</a>
            </nav>
            <div className="t-hd__sp" />
            <Button size="sm" icon={<Icon name="Rocket" size={15} />}>Join the team</Button>
          </div>
        </header>

        <section className="t-hero" data-theme="dark">
          <div className="t-hero__glow" />
          <div className="bp-grid t-hero__in" style={{ '--grid-line': 'color-mix(in oklab, var(--cyan-400) 9%, transparent)' }}>
            <span className="eyebrow" style={{ color: 'var(--cyan-400)' }}>Bergen · est. 2025 · hybrid propulsion</span>
            <h1>Bergens høyeste <em>punkt.</em></h1>
            <p className="t-hero__sub">A student team designing, building, and flying hybrid rockets out of Western Norway University of Applied Sciences. Engineered by students, fired in Bergen.</p>
            <div className="t-hero__cta">
              <Button size="lg" iconRight={<Icon name="ArrowRight" size={17} />}>Join the team</Button>
              <Button size="lg" variant="secondary" icon={<Icon name="Rocket" size={16} />}>Our rockets</Button>
            </div>
            <div className="t-hero__band">
              <Stat value="3.2" unit="km" label="Target apogee" accent />
              <Stat value="982" unit="N" label="Peak thrust" />
              <Stat value="N₂O" label="Oxidizer" />
              <Stat value="2025" label="Founded" />
            </div>
          </div>
        </section>

        <section className="t-feat">
          <div className="t-feat__in">
            <span className="eyebrow">The mission</span>
            <h2 style={{ fontSize: 'clamp(28px,4vw,44px)', margin: '12px 0 0' }}>Every gram, engineered by students.</h2>
            <div className="t-feat__grid">
              {FEATURES.map(([ic, title, desc]) => (
                <Card key={title} interactive>
                  <div className="t-feat__ic"><Icon name={ic} size={22} /></div>
                  <h3 style={{ fontSize: 19, margin: '0 0 8px' }}>{title}</h3>
                  <p style={{ color: 'var(--text-muted)', fontSize: 14, margin: 0, lineHeight: 1.55 }}>{desc}</p>
                </Card>
              ))}
            </div>
          </div>
        </section>

        <footer className="t-ft" data-theme="dark">
          <div className="t-ft__in">
            <img src="../../assets/logo-astro-white.png" alt="Astro HVL" />
            <span>© 2026 Astro HVL · Bergens høyeste punkt</span>
          </div>
        </footer>
      </React.Fragment>
    );
  }

  function mount() {
    if (!window[NS] || !window[NS].Button) { setTimeout(mount, 40); return; }
    ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
  }
  window.addEventListener('load', mount);
</script>
</body>
</html>
